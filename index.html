<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Owned by REyman</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #0f172a, #020617);
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    h1 {
        font-size: 4rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #00f7ff;
        text-shadow:
            0 0 5px #00f7ff,
            0 0 10px #00f7ff,
            0 0 20px #00bcd4,
            0 0 40px #008ba3;
        animation: glow 2s infinite alternate, float 3s ease-in-out infinite;
    }

    @keyframes glow {
        from { text-shadow: 0 0 5px #00f7ff; }
        to { text-shadow: 0 0 25px #00f7ff, 0 0 50px #00bcd4; }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }
</style>
</head>
<body>
    <h1>Owned by REyman</h1>
</body>
</html>
